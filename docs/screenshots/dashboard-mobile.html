<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .topnav { height:52px; border-bottom:1px solid rgb(var(--color-hairline)); display:flex; align-items:center; justify-content:space-between; padding:0 14px; background:rgb(var(--color-panel)); }
  .content { padding: 16px; }
  .greet-row { margin-bottom:16px; }
  .stats-grid { display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:14px; }
  .stat-label { font-size:11px; text-transform:uppercase; color:rgb(var(--color-slate)); font-weight:600; }
  .stat-value { font-size:22px; font-weight:600; margin-top:4px; }
  .avatar { width:26px;height:26px;border-radius:999px;background:rgb(var(--color-signal));color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600; }
</style></head>
<body>
<div class="aurora-bg"><div class="aurora-blob aurora-blob--1"></div><div class="aurora-blob aurora-blob--2"></div><div class="aurora-blob aurora-blob--3"></div></div>
<div class="page">
  <div class="topnav">
    <div style="font-size:20px;">☰</div>
    <div style="display:flex;align-items:center;gap:12px;"><span>🔔</span><div class="avatar">A</div></div>
  </div>
  <div class="content">
    <div class="greet-row"><h1 style="font-size:19px;margin:0;">Good afternoon, Ada 👋</h1><p class="text-slate" style="margin:4px 0 0;font-size:13px;">Here's what's happening with your workflows.</p></div>
    <div class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:16px;">New workflow</div>
    <div class="stats-grid">
      <div class="card"><div class="stat-label">Workflows</div><div class="stat-value">4</div></div>
      <div class="card"><div class="stat-label">Credits remaining</div><div class="stat-value">51,200 <span style="font-size:12px;font-weight:400;color:rgb(var(--color-slate));">/ 63,000</span></div></div>
    </div>
    <div class="card">
      <strong style="font-size:14px;">Recent runs</strong>
      <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgb(var(--color-hairline));font-size:13px;"><span>New signup → Slack alert</span><span class="badge badge-signal">success</span></div>
      <div style="display:flex;justify-content:space-between;padding:9px 0;font-size:13px;"><span>Order sync</span><span class="badge badge-danger">failed</span></div>
    </div>
  </div>
</div>
</body></html>
