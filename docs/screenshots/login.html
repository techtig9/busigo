<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .wrap { max-width: 380px; margin: 90px auto; padding: 0 24px; }
  .field-label { font-size:11px; color:rgb(var(--color-slate)); margin-bottom:4px; display:block; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .field-input { border:1px solid rgb(var(--color-hairline)); border-radius:6px; padding:9px 12px; font-size:14px; width:100%; margin-bottom:14px; background:rgb(var(--color-panel)); color:rgb(var(--color-ink)); }
  .btn-block { width:100%; justify-content:center; margin-bottom:10px; }
  .divider { text-align:center; color:rgb(var(--color-slate)); font-size:12px; margin: 14px 0; }
</style></head>
<body>
<div class="aurora-bg"><div class="aurora-blob aurora-blob--1"></div><div class="aurora-blob aurora-blob--2"></div><div class="aurora-blob aurora-blob--3"></div></div>
<div class="page">
<div style="border-bottom:1px solid rgb(var(--color-hairline));padding:16px 24px;font-weight:600;">busigo</div>
<div class="wrap">
  <h1 style="font-size:22px;margin-bottom:20px;">Log in</h1>
  <span class="field-label">Email</span>
  <div class="field-input">ada@example.com</div>
  <span class="field-label">Password</span>
  <div class="field-input">••••••••••</div>
  <div style="text-align:right;margin-bottom:14px;"><span class="text-signal" style="font-size:13px;">Forgot password?</span></div>
  <div class="btn btn-primary btn-block">Log In</div>
  <div class="btn btn-secondary btn-block">Continue with Google</div>
  <p style="text-align:center;font-size:13px;color:rgb(var(--color-slate));margin-top:16px;">No account? <span class="text-signal">Sign up</span></p>
</div>
</div>
</body></html>
